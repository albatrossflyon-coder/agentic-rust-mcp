[package]
name = "agentic-rust-mcp"
version = "0.4.0"
edition = "2021"
authors = ["Chris Brown <chris@albatrossai.online>"]
description = "Production-grade Rust MCP server for agentic AI pipelines. Integrates Render, Vercel, Buffer, and Firestore."
repository = "https://github.com/albatrossflyon-coder/agentic-rust-mcp"
license = "MIT"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client (for Render, Vercel, Buffer, Firestore)
reqwest = { version = "0.12", features = ["json"] }

# HTTP server for the public web demo (src/bin/web_server.rs)
axum = "0.7"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Environment & Config
dotenv = "0.15"
anyhow = "1.0"

# Time & Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Gmail OAuth + sending
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

[profile.release]
opt-level = 3
lto = true
